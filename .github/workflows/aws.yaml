name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches: [ main ]

jobs:
  Continuous-Integration:
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell
        working-directory: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo   # 👈 short directory path to avoid PathTooLong

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest
        run: |
          $image = "$env:ECR_REGISTRY/$env:ECR_REPOSITORY:$env:IMAGE_TAG"
          docker build -t $image .
          docker push $image
          "image=$image" >> $env:GITHUB_OUTPUT

  Continuous-Deployment:
    needs: Continuous-Integration
    runs-on: [self-hosted, Windows, X64]

    defaults:
      run:
        shell: powershell
        working-directory: repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: repo   # 👈 same short folder

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Run Docker Image on Windows EC2
        run: |
          $image = "${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest"

          # Optional: stop & remove old container named 'visa-app' if it exists
          $existing = docker ps -q --filter "name=visa-app"
          if ($existing) {
            docker stop $existing | Out-Null
            docker rm $existing | Out-Null
          }

          docker run -d `
            --name visa-app `
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" `
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" `
            -e AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" `
            -e MONGODB_URL="${{ secrets.MONGODB_URL }}" `
            -p 8080:8080 `
            $image
